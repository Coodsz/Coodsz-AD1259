#
# The AD1259 mod report form for Coodsz/Coodsz-AD1259. .github/scripts/tally-taom-compat.mjs
# (--list ad1259) counts these into compat/ad1259-mod-compat.json and MODS.md.
name: AD1259 mod report
description: Tell us how a mod worked with the AD1259 Coop pack
title: "[Mod] "
labels: ["mod-compat", "ad1259"]
body:
  - type: markdown
    attributes:
      value: |
        Please only report what you really tested with the AD1259 pack. Without a GitHub account, use **Report a mod** in the Coodsz AD1259 Client Launcher instead.
        Your report shows as a player count next to this mod on the [AD1259 mod list](https://github.com/Coodsz/Coodsz-AD1259/blob/main/MODS.md). The status stays what Coodsz checked.
  - type: input
    id: mod_id
    attributes:
      label: Mod id
      description: The Module Id, as shown in the AD1259 Client Launcher (or the Id in the mod's SubModule.xml)
    validations:
      required: true
  - type: input
    id: mod_name
    attributes:
      label: Mod name
      description: The mod's display name, if you know it
  - type: input
    id: mod_version
    attributes:
      label: Mod version
  # The option texts have to match what .github/scripts/tally-mod-compat.mjs (normalizeResult) reads.
  - type: dropdown
    id: status
    attributes:
      label: Result
      options:
        - works
        - broken
        - client-only
    validations:
      required: true
  - type: input
    id: ad1259_version
    attributes:
      label: AD1259 version
      placeholder: "1.4.6"
    validations:
      required: true
  - type: input
    id: coop_version
    attributes:
      label: Coop version
      placeholder: "v0.1.6"
  - type: input
    id: game_version
    attributes:
      label: Bannerlord version
      placeholder: "v1.4.8"
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: |
        The error message, when it happened (joining, a battle, a siege), and whether the mod was on for the host, the players or both.
